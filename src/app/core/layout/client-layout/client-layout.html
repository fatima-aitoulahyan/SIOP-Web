<div class="layout" [class.sidebar-collapsed]="sidebarReduite()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-container">
        <img src="/assets/logo-spelev.png" alt="SPELEV" />
      </div>
      <button type="button" class="btn-collapse" (click)="toggleSidebar()" [title]="sidebarReduite() ? 'Agrandir' : 'Réduire'">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!sidebarReduite()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          <path *ngIf="sidebarReduite()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <nav class="menu">
      <a routerLink="/client/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
        </svg>
        <span class="menu-text">Tableau de bord</span>
      </a>
      <a routerLink="/client/demandes" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
        <span class="menu-text">Mes demandes</span>
      </a>
      <a routerLink="/client/demandes/nouveau" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        <span class="menu-text">Nouvelle demande</span>
      </a>
      <a routerLink="/client/demandes/nouvelle-evaluation" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
        <span class="menu-text">Demande d'évaluation</span>
      </a>

      <!-- Lien Mon Profil pour le client -->
      <a routerLink="/client/profil" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="menu-text">Mon profil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="btn-deconnexion" (click)="deconnexion()">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="menu-text">Déconnexion</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="topbar-actions">
        <app-notification-bell></app-notification-bell>

        <!-- Bouton / Icône de profil -->
        <a routerLink="/client/profil" class="profile-icon-btn" title="Mon profil">
          <span class="material-symbols-outlined">account_circle</span>
        </a>
      </div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
