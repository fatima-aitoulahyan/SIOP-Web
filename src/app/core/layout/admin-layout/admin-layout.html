<div class="layout" [class.sidebar-collapsed]="sidebarReduite()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo-container">
        <img src="/assets/logo-spelev.png" alt="SPELEV" />
      </div>
      <button type="button" class="btn-collapse" (click)="toggleSidebar()" [title]="sidebarReduite() ? 'Agrandir' : 'Réduire'">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path *ngIf="!sidebarReduite()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
          <path *ngIf="sidebarReduite()" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
        </svg>
      </button>
    </div>

    <nav class="menu">
      <!-- Tableau de bord Admin -->
      <a *ngIf="role() === 'ADMINISTRATEUR'" routerLink="/dashboard/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        <span class="menu-text">Tableau de bord</span>
      </a>

      <!-- Tableau de bord Responsable -->
      <a *ngIf="role() === 'RESPONSABLE_MAINTENANCE'" routerLink="/dashboard/responsable-maintenance" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
        <span class="menu-text">Tableau de bord</span>
      </a>
      <a routerLink="/chatbot" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <span class="menu-text">Assistant IA</span>
      </a>

      <a *ngIf="role() === 'ADMINISTRATEUR'" routerLink="/utilisateurs" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <span class="menu-text">Utilisateurs</span>
      </a>

      <!-- Fonctionnalités communes -->
      <a routerLink="/ascenseurs" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
        <span class="menu-text">Ascenseurs</span>
      </a>

      <a routerLink="/sites" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        <span class="menu-text">Sites</span>
      </a>

      <!-- Menu déroulant "Demandes" (Pour Responsable) -->
      <div class="dropdown-menu-container" *ngIf="role() === 'RESPONSABLE_MAINTENANCE' || role() === 'ADMINISTRATEUR'">
        <button type="button" class="menu-item dropdown-toggle" (click)="toggleDemandes()">
          <span class="dropdown-left" style="display: flex; align-items: center; gap: 14px;">
            <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
            <span class="menu-text">Demandes</span>
          </span>
          <svg class="arrow" [class.open]="demandesOuvert()" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width: 14px; height: 14px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </button>

        <div class="dropdown-content" [class.show]="demandesOuvert() ">
          <a routerLink="/responsable/demandes" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="menu-item sub-item">
            Maintenance
          </a>
          <a routerLink="/responsable/evaluations" routerLinkActive="active" class="menu-item sub-item">
            Nouvelles installations
          </a>
          <a routerLink="/responsable/evaluations-en-attente" routerLinkActive="active" class="menu-item sub-item">
            Rapports à valider
          </a>
        </div>
      </div>

      <a *ngIf="role() === 'RESPONSABLE_MAINTENANCE'" routerLink="/responsable/bons-travail" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
        <span class="menu-text">Bons de travail</span>
      </a>

      <a *ngIf="role() === 'RESPONSABLE_MAINTENANCE' || role() === 'ADMINISTRATEUR'" routerLink="/responsable/calendrier" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <span class="menu-text">Calendrier</span>
      </a>

      <a routerLink="/parcs" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
        <span class="menu-text">Parcs</span>
      </a>

      <!-- Lien Mon Profil -->
      <a *ngIf="role() === 'ADMINISTRATEUR'" routerLink="/admin/profil" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="menu-text">Mon profil</span>
      </a>

      <a *ngIf="role() === 'RESPONSABLE_MAINTENANCE'" routerLink="/responsable/profil" routerLinkActive="active" class="menu-item">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span class="menu-text">Mon profil</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button type="button" class="btn-deconnexion" (click)="deconnexion()">
        <svg class="menu-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        <span class="menu-text">Déconnexion</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <div class="topbar-actions">
        <app-notification-bell></app-notification-bell>

        <a [routerLink]="role() === 'ADMINISTRATEUR' ? '/admin/profil' : '/responsable/profil'" routerLinkActive="active" class="profile-icon-btn" title="Mon profil">
          <span class="material-symbols-outlined">account_circle</span>
        </a>
      </div>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
