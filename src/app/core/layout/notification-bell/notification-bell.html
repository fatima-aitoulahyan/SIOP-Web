<div class="notification-container">
  <!-- Bouton cloche -->
  <button (click)="togglePanel()" class="bell-btn" [class.active]="panelOuvert" aria-label="Notifications">
    <svg class="bell-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <span class="badge" *ngIf="nonLuesCount > 0">{{ nonLuesCount > 99 ? '99+' : nonLuesCount }}</span>
  </button>

  <!-- Panneau déroulant -->
  <div class="notification-panel" *ngIf="panelOuvert">
    <div class="panel-header">
      <h3>Notifications</h3>
      <span class="badge-count" *ngIf="nonLuesCount > 0">{{ nonLuesCount }} non lue{{ nonLuesCount > 1 ? 's' : '' }}</span>
    </div>

    <div class="panel-body">
      <div *ngIf="notifications.length === 0" class="empty-state">
        <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
        <p>Aucune notification pour le moment</p>
      </div>

      <div
        *ngFor="let n of notifications"
        class="notif-item"
        [class.unread]="!n.lu"
        (click)="ouvrirNotification(n)">
        <div class="notif-indicator" *ngIf="!n.lu"></div>
        <div class="notif-content">
          <div class="notif-title-row">
            <strong>{{ n.titre }}</strong>
            <small>{{ n.dateCreation | date:'shortTime' }}</small>
          </div>
          <p>{{ n.message }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
