<div class="layout">
  <aside class="sidebar">
    <div class="logo-card">
      <img src="/assets/logo-spelev.png" alt="SPELEV" />
    </div>

    <nav class="menu">
      <!-- ADMIN -->
      <a *ngIf="role() === 'ADMINISTRATEUR'" routerLink="/dashboard/admin" routerLinkActive="active" class="menu-item">
        Tableau de bord
      </a>
      <a *ngIf="role() === 'ADMINISTRATEUR'" routerLink="/utilisateurs" routerLinkActive="active" class="menu-item">
        Utilisateurs
      </a>

      <!-- RESPONSABLE -->
      <ng-container *ngIf="role() === 'RESPONSABLE_MAINTENANCE'">
        <a routerLink="/dashboard/responsable-maintenance" routerLinkActive="active" class="menu-item">Tableau de bord</a>
        <a routerLink="/ascenseurs" routerLinkActive="active" class="menu-item">Ascenseurs</a>
        <a routerLink="/sites" routerLinkActive="active" class="menu-item">Sites</a>

        <!-- Menu déroulant "Demandes" -->
        <div class="dropdown-menu-container">
          <button type="button" class="menu-item dropdown-toggle" (click)="toggleDemandes()">
            <span>Demandes</span>
            <span class="arrow" [class.open]="demandesOuvert()">▼</span>
          </button>

          <div class="dropdown-content" [class.show]="demandesOuvert()">
            <a routerLink="/responsable/demandes" [routerLinkActiveOptions]="{exact: true}" routerLinkActive="active" class="menu-item sub-item">
              Maintenance
            </a>
            <a routerLink="/responsable/evaluations" routerLinkActive="active" class="menu-item sub-item">
              Nouvelles installations
            </a>
            <a routerLink="/responsable/evaluations-en-attente" routerLinkActive="active" class="menu-item sub-item">
              Rapports à valider
            </a>
          </div>
        </div>

        <a routerLink="/responsable/bons-travail" routerLinkActive="active" class="menu-item">Bons de travail</a>
      </ng-container>

      <!-- TECHNICIEN -->
      <ng-container *ngIf="role() === 'TECHNICIEN'">
        <a routerLink="/technicien/bons-travail" routerLinkActive="active" class="menu-item">Mes interventions</a>
        <a routerLink="/technicien/demandes" routerLinkActive="active" class="menu-item">Demandes</a>
      </ng-container>

      <!-- TOUS -->
      <a *ngIf="role() !== 'TECHNICIEN'" routerLink="/parcs" routerLinkActive="active" class="menu-item">Parcs</a>
    </nav>

    <button type="button" class="btn-deconnexion" (click)="deconnexion()">Déconnexion</button>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
