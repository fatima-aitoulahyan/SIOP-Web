<div class="login-page">
  <div class="login-container">
    <div class="logo">
      <img src="assets/logo-spelev.png" alt="SPELEV Logo" />
    </div>

    @if (successMessage()) {
      <p class="success">{{ successMessage() }}</p>
    } @else if (!token()) {
      <p class="error">{{ errorMessage() }}</p>
    } @else {
      <form [formGroup]="activationForm" (ngSubmit)="onSubmit()">
        <h2>Activation du compte</h2>
        <p class="subtitle">Définissez votre mot de passe pour activer votre compte</p>

        <div class="form-group">
          <label for="motDePasse">Nouveau mot de passe</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="motDePasse"
              formControlName="motDePasse"
            />
            <button type="button" class="toggle-visibility" (click)="togglePassword()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmMotDePasse">Confirmer le mot de passe</label>
          <div class="input-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              id="confirmMotDePasse"
              formControlName="confirmMotDePasse"
            />
          </div>
        </div>

        <button type="submit" [disabled]="loading()">
          {{ loading() ? 'Activation...' : 'Activer mon compte' }}
        </button>

        @if (errorMessage()) {
          <p class="error">{{ errorMessage() }}</p>
        }
      </form>
    }
  </div>
</div>
