services:
  # =====================================================
  # PostgreSQL — jamais exposé publiquement
  # =====================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - siop_pgdata:/var/lib/postgresql/data
    networks:
      - siop_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================================================
  # MinIO — accès interne pour le backend, accès public
  # limité à la génération d'URLs présignées via Traefik
  # =====================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    networks:
      - siop_internal
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # Backend Spring Boot
  # =====================================================
  backend:
    build:
      context: ./backend_siop
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Validation uniquement — jamais de modification automatique du schéma
      # en production. Le schéma doit être piloté par les migrations
      # (Flyway) et non par Hibernate.
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: 86400000
      # MinIO — URL interne pour les opérations serveur (upload)
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: siop-fichiers
      # URL publique réelle (sous-domaine dédié), utilisée uniquement pour
      # générer les liens présignés consultables depuis le navigateur —
      # jamais http://minio:9000, qui ne se résout qu'entre conteneurs.
      MINIO_PUBLIC_URL:  ${MINIO_PUBLIC_URL}
      # Mail
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: 587
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # Frontend
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
      # Groq
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: llama-3.3-70b-versatile
      # Logging
      LOG_LEVEL_WEB: INFO
      LOG_LEVEL_SECURITY: INFO
      LOG_LEVEL_APP: INFO
      # Intégration externe (n8n)
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
    networks:
      - siop_internal
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # =====================================================
  # Frontend / Nginx
  # =====================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dokploy-network

# =====================================================
# Réseaux
# =====================================================
networks:
  siop_internal:
  dokploy-network:
    external: true

# =====================================================
# Volumes
# =====================================================
volumes:
  siop_pgdata:
  minio_data: