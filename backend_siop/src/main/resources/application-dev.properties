spring.application.name=backend_siop
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/siop_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:siop_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:siop_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME:siop-fichiers}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

# Intégration n8n
integration.api-key=${INTEGRATION_API_KEY}
integration.system.email=${INTEGRATION_SYSTEM_EMAIL:integration@spelev-system.local}

integration.fallback.technician-email=${INTEGRATION_FALLBACK_TECHNICIAN_EMAIL:integration-tech@spelev-system.local}
integration.fallback.technician-parc-name=${INTEGRATION_FALLBACK_TECHNICIAN_PARC_NAME:Parc URGENCE}

# Logging – valeurs par défaut pour l'environnement de développement
logging.level.org.springframework.web=${LOG_LEVEL_WEB:DEBUG}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:DEBUG}
logging.level.com.example.backend_siop=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.web.servlet.mvc.method.annotation=${LOG_LEVEL_MVC:TRACE}