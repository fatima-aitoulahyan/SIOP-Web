spring.application.name=backend_siop
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# =====================================================
# Base de donnees
# Valeurs par defaut = dev local, ecrasees par les env vars en Docker/prod
# =====================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/siop_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:siop_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:siop_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

server.port=8080

# =====================================================
# JWT ? le secret DOIT etre fourni en prod, pas de valeur par defaut faible
# =====================================================
jwt.secret=${JWT_SECRET:changeMeToALongRandomSecretKeyForDevOnly123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# =====================================================
# MinIO
# =====================================================
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:siop_admin}
minio.secret-key=${MINIO_SECRET_KEY:siop_password_2026}
minio.bucket-name=${MINIO_BUCKET_NAME:siop-fichiers}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =====================================================
# Mail (SMTP) ? aucun secret en dur, tout vient de l'environnement
# =====================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =====================================================
# Frontend
# =====================================================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

# =====================================================
# Groq API
# =====================================================
groq.api-key=${GROQ_API_KEY:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}

# =====================================================
# Logging ? niveau reduit par defaut, override en dev si besoin
# =====================================================
logging.level.org.springframework.web=${LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.level.com.example.backend_siop=${LOG_LEVEL_APP:INFO}
